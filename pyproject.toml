[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "log-anomaly-detector"
version = "0.1.0"
description = "Bounded, deterministic offline authentication-log rules"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "notfrostedwow"}]
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
log-anomaly-detector = "log_anomaly_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

